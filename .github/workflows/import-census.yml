name: Import Census data
on:
  workflow_dispatch:
    inputs:
      product_code:
        description: Reviewed HS6 product code
        required: true
        type: string
        default: '090121'
      reporting_month:
        description: Confirmed published reporting month (YYYY-MM)
        required: true
        type: string
      archive_to_r2:
        description: Restore and archive in private R2; promote unless candidate_only is enabled (main only)
        type: boolean
        default: false
      candidate_only:
        description: Prepare for review without promotion (requires archive_to_r2 and an existing archive on main)
        type: boolean
        default: false
      include_duties:
        description: Include the validated 24-month estimated-duties dataset
        type: boolean
        default: false
      initialize_archive:
        description: Initialize an archive only when its current pointer is absent
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: census-data-import
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SITE_PACKAGE_PYTHON: python3
      PRODUCT_CODE: ${{ inputs.product_code }}
      REPORTING_MONTH: ${{ inputs.reporting_month }}
      ARCHIVE_TO_R2: ${{ inputs.archive_to_r2 }}
      CANDIDATE_ONLY: ${{ inputs.candidate_only }}
      INITIALIZE_ARCHIVE: ${{ inputs.initialize_archive }}
      INCLUDE_DUTIES: ${{ inputs.include_duties }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci
      - run: npm test
      - name: Validate dispatch inputs
        id: preflight
        run: npm run data:archive -- preflight
      - name: Restore the accepted baseline
        id: restore
        if: inputs.archive_to_r2 && github.ref == 'refs/heads/main'
        env:
          DATA_DIR: ${{ steps.preflight.outputs.data_dir }}
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_BUCKET_NAME: ${{ vars.R2_BUCKET_NAME }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: npm run data:archive -- restore --product "$PRODUCT_CODE" --data-dir "$DATA_DIR" --run-dir .tmp/archive
      - name: Retrieve and validate the reviewed product
        id: import
        env:
          CLASSIFICATION_FILE: ${{ steps.preflight.outputs.classification_file }}
          CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
          REPORTING_MONTH: ${{ inputs.reporting_month }}
          INCLUDE_DUTIES: ${{ inputs.include_duties }}
        run: |
          duty_args=()
          if [[ "$INCLUDE_DUTIES" == "true" ]]; then duty_args+=(--duties); fi
          classification_args=()
          if [[ -f "$CLASSIFICATION_FILE" ]]; then classification_args+=(--classification "$CLASSIFICATION_FILE"); fi
          npm run data:import -- --product "$PRODUCT_CODE" --end "$REPORTING_MONTH" --months 60 "${classification_args[@]}" "${duty_args[@]}"
      - id: validate
        run: npm run data:validate -- --product "$PRODUCT_CODE"
      - name: Upload and verify the immutable candidate
        id: stage
        if: inputs.archive_to_r2 && github.ref == 'refs/heads/main'
        env:
          DATA_DIR: ${{ steps.preflight.outputs.data_dir }}
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_BUCKET_NAME: ${{ vars.R2_BUCKET_NAME }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: npm run data:archive -- stage --product "$PRODUCT_CODE" --data-dir "$DATA_DIR" --run-dir .tmp/archive
      - name: Require both candidate backup members
        id: candidate_files
        if: inputs.archive_to_r2 && github.ref == 'refs/heads/main'
        run: |
          test -s .tmp/archive/bundle.json
          test -s .tmp/archive/candidate.json
      - name: Back up the candidate before promotion
        id: backup
        if: inputs.archive_to_r2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: census-${{ steps.preflight.outputs.product_code }}-candidate
          path: |
            .tmp/archive/bundle.json
            .tmp/archive/candidate.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - name: Recover the backed-up candidate offline
        id: recovery
        if: success() && inputs.archive_to_r2 && steps.backup.outcome == 'success'
        run: npm run data:archive -- verify --product "$PRODUCT_CODE" --data-dir .tmp/recovery/data --run-dir .tmp/archive
      - name: Report the candidate ready for review
        id: candidate_ready
        if: success() && inputs.candidate_only && inputs.archive_to_r2 && github.ref == 'refs/heads/main' && steps.restore.outcome == 'success' && steps.stage.outcome == 'success' && steps.backup.outcome == 'success' && steps.recovery.outcome == 'success'
        env:
          BACKUP_ARTIFACT_ID: ${{ steps.backup.outputs.artifact-id }}
          BACKUP_ARTIFACT_DIGEST: ${{ steps.backup.outputs.artifact-digest }}
        run: |
          printf '### Candidate ready for review\n\nProduct: %s\n\nReporting month: %s\n\nBackup artifact ID: %s\n\nBackup artifact digest: %s\n\nBaseline restoration, candidate staging, backup and offline recovery succeeded. Promotion was skipped; review is required before acceptance.\n' "$PRODUCT_CODE" "$REPORTING_MONTH" "$BACKUP_ARTIFACT_ID" "$BACKUP_ARTIFACT_DIGEST" >> "$GITHUB_STEP_SUMMARY"
      - name: Promote the backed-up candidate conditionally
        id: promote
        if: success() && inputs.archive_to_r2 && !inputs.candidate_only && github.ref == 'refs/heads/main' && steps.backup.outcome == 'success' && steps.recovery.outcome == 'success'
        env:
          DATA_DIR: ${{ steps.preflight.outputs.data_dir }}
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_BUCKET_NAME: ${{ vars.R2_BUCKET_NAME }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          BACKUP_ARTIFACT_ID: ${{ steps.backup.outputs.artifact-id }}
          BACKUP_ARTIFACT_DIGEST: ${{ steps.backup.outputs.artifact-digest }}
        run: npm run data:archive -- promote --product "$PRODUCT_CODE" --data-dir "$DATA_DIR" --run-dir .tmp/archive
      - name: Retain the promotion outcome
        if: always() && inputs.archive_to_r2 && hashFiles('.tmp/archive/outcome.json') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: census-${{ steps.preflight.outputs.product_code }}-promotion
          path: .tmp/archive/outcome.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: '!inputs.archive_to_r2'
        with:
          name: census-${{ steps.preflight.outputs.product_code }}-release
          path: |
            ${{ steps.preflight.outputs.processed_dir }}/current.json
            ${{ steps.preflight.outputs.processed_dir }}/releases/*.json
            ${{ steps.preflight.outputs.data_dir }}/raw/**/*.json
          if-no-files-found: error
          retention-days: 7
