name: Import Census data
on:
  workflow_dispatch:
    inputs:
      reporting_month:
        description: Confirmed published reporting month (YYYY-MM)
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: census-data-import
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci
      - run: npm test
      - name: Retrieve and validate the coffee sample
        env:
          CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
          REPORTING_MONTH: ${{ inputs.reporting_month }}
        run: npm run data:import -- --product 090121 --end "$REPORTING_MONTH" --months 60
      - run: npm run data:validate
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: census-coffee-release
          path: |
            data/processed/current.json
            data/processed/releases/*.json
            data/raw/**/*.json
          if-no-files-found: error
          retention-days: 7
