name: Audit Canada country data
on:
  workflow_dispatch:
    inputs:
      country_code:
        description: Reviewed country code (1220 Canada)
        required: true
        type: string
        default: '1220'
      reporting_month:
        description: Reviewed reporting month (2026-08)
        required: true
        type: string
        default: '2026-08'
      audit_mode:
        description: Full audit or fixed connectivity, followup, aggregate, total, or prefix probe
        required: true
        type: choice
        default: full
        options:
          - full
          - connectivity-probe
          - source-followup
          - aggregate-probe
          - total-probe
          - prefix-probe
permissions:
  contents: read
concurrency:
  group: census-country-audit
  cancel-in-progress: false
jobs:
  audit:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COUNTRY_CODE: ${{ inputs.country_code }}
      REPORTING_MONTH: ${{ inputs.reporting_month }}
      AUDIT_MODE: ${{ inputs.audit_mode }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci
      - run: npm test
      - run: npm run check
      - name: Validate reviewed Canada pilot before key access
        id: preflight
        run: |
          case "$AUDIT_MODE" in full|connectivity-probe|source-followup|aggregate-probe|total-probe|prefix-probe) ;; *) exit 1 ;; esac
          npm run data:audit-country -- --preflight --country "$COUNTRY_CODE" --end "$REPORTING_MONTH"
      - name: Audit country totals and complete HS6 breakdowns
        if: inputs.audit_mode == 'full'
        # Leave time for the always-run source artifact after a stalled retrieval.
        timeout-minutes: 15
        env:
          CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
        run: npm run data:audit-country -- --country "$COUNTRY_CODE" --end "$REPORTING_MONTH"
      - name: Diagnose API connectivity with six logical checks
        if: inputs.audit_mode == 'connectivity-probe'
        timeout-minutes: 4
        env:
          CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
        run: npm run data:probe-country -- --country "$COUNTRY_CODE" --end "$REPORTING_MONTH"
      - name: Diagnose fixed import gaps and export cumulative total
        if: inputs.audit_mode == 'source-followup'
        # Reference alone, then five API pairs: permitted retry schedule <= 487.5s.
        timeout-minutes: 9
        env:
          CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
        run: npm run data:diagnose-country -- --country "$COUNTRY_CODE" --end "$REPORTING_MONTH"
      - name: Compare fixed original and explicit aggregate queries
        if: inputs.audit_mode == 'aggregate-probe'
        # Reference alone, then four API pairs: permitted retry schedule <= 396s.
        timeout-minutes: 7
        env:
          CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
        run: npm run data:probe-aggregates -- --country "$COUNTRY_CODE" --end "$REPORTING_MONTH"
      - name: Compare fixed HS and end-use import totals
        if: inputs.audit_mode == 'total-probe'
        # Reference alone, then three API pairs: permitted retry schedule <= 304.5s.
        timeout-minutes: 6
        env:
          CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
        run: npm run data:probe-totals -- --country "$COUNTRY_CODE" --end "$REPORTING_MONTH"
      - name: Compare full import breakdowns with a fixed commodity prefix
        if: inputs.audit_mode == 'prefix-probe'
        # Reference alone, then three API pairs: permitted retry schedule <= 304.5s.
        timeout-minutes: 6
        env:
          CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
        run: npm run data:probe-prefix -- --country "$COUNTRY_CODE" --end "$REPORTING_MONTH"
      - name: Retain source evidence even on validation failure
        if: always() && steps.preflight.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: census-1220-country-audit
          path: .tmp/country-audit/1220/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
