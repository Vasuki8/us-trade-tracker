name: Audit product estimated duties
on:
  workflow_dispatch:
    inputs:
      product_code:
        description: Reviewed HS6 product code (090121 roasted coffee or 090111 green coffee)
        required: true
        type: string
        default: '090121'
      reporting_month:
        description: Confirmed published reporting month (YYYY-MM), initially 2026-08
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: census-duty-audit
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PRODUCT_CODE: ${{ inputs.product_code }}
      REPORTING_MONTH: ${{ inputs.reporting_month }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci
      - run: npm test
      - run: npm run check
      - name: Validate the reviewed product and reporting month
        id: preflight
        run: npm run data:archive -- preflight
      - name: Retrieve and reconcile 24 product duty months
        env:
          CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
        run: npm run data:audit-duties -- --product "$PRODUCT_CODE" --end "$REPORTING_MONTH"
      - name: Retain audit evidence even when coverage fails
        if: always() && steps.preflight.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: census-${{ steps.preflight.outputs.product_code }}-duty-audit
          path: .tmp/duty-audit/${{ steps.preflight.outputs.product_code }}/
          if-no-files-found: warn
          retention-days: 7
