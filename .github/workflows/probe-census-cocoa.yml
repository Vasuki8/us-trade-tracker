name: Probe fixed cocoa merchandise requests
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cocoa-merchandise-diagnostic
  cancel-in-progress: false
jobs:
  probe:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SITE_PACKAGE_PYTHON: python3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci
      - run: npm test -- tests/scripts/cocoa-probe.test.ts --maxWorkers=2
      - run: npm run check
      - name: Check fixed request bounds and fresh output without credentials
        id: preflight
        run: npm run data:probe-cocoa -- --preflight
      - name: Capture eight single-attempt cocoa request diagnostics
        timeout-minutes: 5
        env:
          CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
        run: npm run data:probe-cocoa
      - name: Retain safe partial diagnostic evidence
        if: always() && steps.preflight.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: cocoa-merchandise-diagnostic
          path: .tmp/cocoa-diagnostic/
          if-no-files-found: warn
          retention-days: 7
